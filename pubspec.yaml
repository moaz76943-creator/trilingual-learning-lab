name: trilingual_learning_lab
description: "Trilingual vocabulary learning app (Arabic, German, English) - Offline First"
publish_to: "none"
version: 0.12.0+12

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - content/vocabulary/family_a1.json
    - content/vocabulary/food_a1.json
    - content/vocabulary/home_a1.json
    - content/vocabulary/clothes_a1.json
    - content/vocabulary/colors_numbers_a1.json
    - content/vocabulary/time_calendar_a1.json
    - content/vocabulary/body_health_a1.json
    - content/vocabulary/city_transport_a1.json
    - content/vocabulary/nature_animals_a1.json
    - content/vocabulary/work_study_a1.json
    - content/verbs/verbs_a1.json
    - content/grammar/sentences_a1.json
    - content/assets/images_registry.json
    - content/assets/svg/
