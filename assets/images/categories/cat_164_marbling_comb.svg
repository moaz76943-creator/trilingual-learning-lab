<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="combSpine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8d6e63"/>
      <stop offset="50%" stop-color="#5d4037"/>
      <stop offset="100%" stop-color="#3e2723"/>
    </linearGradient>
    <linearGradient id="brassNeedles" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff59d"/>
      <stop offset="40%" stop-color="#fbc02d"/>
      <stop offset="100%" stop-color="#b78103"/>
    </linearGradient>
  </defs>
  <!-- Long Wooden Spine Handle (Horizontal Bar) -->
  <rect x="20" y="45" width="160" height="24" rx="4" fill="url(#combSpine)" stroke="#271b16" stroke-width="2"/>
  <circle cx="45" cy="57" r="4" fill="#ffd54f"/>
  <circle cx="100" cy="57" r="4" fill="#ffd54f"/>
  <circle cx="155" cy="57" r="4" fill="#ffd54f"/>
  <!-- Row of Evenly Spaced Brass Wire Teeth / Needles Projecting Downwards -->
  <g stroke="url(#brassNeedles)" stroke-width="2.5" stroke-linecap="round">
    <line x1="30" y1="69" x2="30" y2="160"/>
    <line x1="44" y1="69" x2="44" y2="160"/>
    <line x1="58" y1="69" x2="58" y2="160"/>
    <line x1="72" y1="69" x2="72" y2="160"/>
    <line x1="86" y1="69" x2="86" y2="160"/>
    <line x1="100" y1="69" x2="100" y2="160"/>
    <line x1="114" y1="69" x2="114" y2="160"/>
    <line x1="128" y1="69" x2="128" y2="160"/>
    <line x1="142" y1="69" x2="142" y2="160"/>
    <line x1="156" y1="69" x2="156" y2="160"/>
    <line x1="170" y1="69" x2="170" y2="160"/>
  </g>
  <!-- Needle Point Highlights -->
  <circle cx="100" cy="162" r="2" fill="#ffffff"/>
  <circle cx="58" cy="162" r="2" fill="#ffffff"/>
  <circle cx="142" cy="162" r="2" fill="#ffffff"/>
</svg>
