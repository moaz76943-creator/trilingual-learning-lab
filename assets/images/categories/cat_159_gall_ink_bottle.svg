<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="ceramicFlask" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#37474f"/>
      <stop offset="40%" stop-color="#546e7a"/>
      <stop offset="100%" stop-color="#212121"/>
    </linearGradient>
    <linearGradient id="deepBlackInk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#212121"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
  </defs>
  <!-- Ceramic Apothecary Flask Body -->
  <path d="M 65,75 C 50,95 45,140 60,165 L 140,165 C 155,140 150,95 135,75 L 125,45 L 75,45 Z" fill="url(#ceramicFlask)" stroke="#263238" stroke-width="2.5"/>
  <ellipse cx="100" cy="165" rx="40" ry="10" fill="#212121"/>
  <!-- Bottle Neck and Flanged Lip -->
  <rect x="75" y="32" width="50" height="15" rx="3" fill="#455a64" stroke="#263238" stroke-width="1.8"/>
  <ellipse cx="100" cy="32" rx="25" ry="6" fill="#263238"/>
  <!-- Wax-Sealed Cork Stopper -->
  <polygon points="85,32 115,32 110,18 90,18" fill="#c62828" stroke="#3e2723" stroke-width="1.5"/>
  <!-- Front Calligraphic Paper Label -->
  <rect x="70" y="90" width="60" height="45" rx="3" fill="#fffde7" stroke="#bcaaa4" stroke-width="1.5"/>
  <text x="100" y="112" font-family="serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">حِبْرُ العَفْصِ</text>
  <line x1="78" y1="122" x2="122" y2="122" stroke="#bcaaa4" stroke-width="1.2"/>
  <!-- Aleppo Oak Gallnut and Green Vitriol Crystal Beside Flask -->
  <circle cx="160" cy="155" r="14" fill="#8d6e63" stroke="#3e2723" stroke-width="1.5"/>
  <polygon points="152,168 165,160 172,172 158,175" fill="#00e676" stroke="#1b5e20" stroke-width="1.2"/>
</svg>
