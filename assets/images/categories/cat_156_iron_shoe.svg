<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="ironSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#90a4ae"/>
      <stop offset="40%" stop-color="#546e7a"/>
      <stop offset="80%" stop-color="#37474f"/>
      <stop offset="100%" stop-color="#212121"/>
    </linearGradient>
  </defs>
  <!-- Wooden Hammer Shaft Socket at Top -->
  <rect x="65" y="25" width="70" height="50" rx="3" fill="#8d6e63" stroke="#3e2723" stroke-width="2"/>
  <line x1="75" y1="35" x2="75" y2="65" stroke="#5d4037" stroke-width="2"/>
  <line x1="100" y1="30" x2="100" y2="70" stroke="#5d4037" stroke-width="2"/>
  <line x1="125" y1="35" x2="125" y2="65" stroke="#5d4037" stroke-width="2"/>
  <!-- Heavy Forged Iron Shoe Block -->
  <path d="M 50,75 L 150,75 L 160,150 Q 160,175 100,175 Q 40,175 40,150 Z" fill="url(#ironSteel)" stroke="#212121" stroke-width="3"/>
  <!-- Iron Clamping Straps & Rivets -->
  <rect x="46" y="85" width="108" height="14" rx="2" fill="#263238" stroke="#ffd54f" stroke-width="1"/>
  <circle cx="65" cy="92" r="3" fill="#ffd54f"/>
  <circle cx="100" cy="92" r="3" fill="#ffd54f"/>
  <circle cx="135" cy="92" r="3" fill="#ffd54f"/>
  <!-- Striking Face Blunted Bevel at Base -->
  <ellipse cx="100" cy="165" rx="45" ry="6" fill="#37474f"/>
</svg>
