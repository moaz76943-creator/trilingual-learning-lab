<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="wallStone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#efebe9"/>
      <stop offset="50%" stop-color="#d7ccc8"/>
      <stop offset="100%" stop-color="#bcaaa4"/>
    </linearGradient>
    <linearGradient id="wallGnomon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff176"/>
      <stop offset="60%" stop-color="#fbc02d"/>
      <stop offset="100%" stop-color="#8d6e63"/>
    </linearGradient>
  </defs>
  <!-- Vertical Wall Plaque (Tall rectangular stone tablet) -->
  <rect x="25" y="15" width="150" height="170" rx="4" fill="url(#wallStone)" stroke="#5d4037" stroke-width="3"/>
  <rect x="32" y="22" width="136" height="156" fill="none" stroke="#8d6e63" stroke-width="1.2"/>
  <!-- Asymmetric Radiating Hour Lines for Declining Wall (Origin at 90, 40) -->
  <!-- Morning hours (bunched together to the left) -->
  <line x1="90" y1="40" x2="35" y2="70" stroke="#3e2723" stroke-width="1.5"/>
  <line x1="90" y1="40" x2="35" y2="100" stroke="#3e2723" stroke-width="1.5"/>
  <line x1="90" y1="40" x2="40" y2="135" stroke="#3e2723" stroke-width="1.5"/>
  <line x1="90" y1="40" x2="60" y2="165" stroke="#3e2723" stroke-width="1.8"/> <!-- Solar Noon Line (Tilted) -->
  <!-- Afternoon hours (broadly spaced toward the right) -->
  <line x1="90" y1="40" x2="95" y2="170" stroke="#3e2723" stroke-width="1.5"/>
  <line x1="90" y1="40" x2="130" y2="165" stroke="#3e2723" stroke-width="1.5"/>
  <line x1="90" y1="40" x2="160" y2="140" stroke="#3e2723" stroke-width="1.5"/>
  <line x1="90" y1="40" x2="165" y2="100" stroke="#3e2723" stroke-width="1.5"/>
  <line x1="90" y1="40" x2="165" y2="65" stroke="#3e2723" stroke-width="1.5"/>
  <!-- Slanted Brass Gnomon (Stylus) Mounted at (90,40) -->
  <polygon points="87,37 93,37 105,105 101,107" fill="url(#wallGnomon)" stroke="#3e2723" stroke-width="1.5"/>
  <circle cx="90" cy="40" r="4.5" fill="#f57f17" stroke="#3e2723" stroke-width="1.5"/>
  <!-- Dynamic Shadow projected across the afternoon quadrant -->
  <polygon points="90,40 125,160 122,160" fill="#212121" fill-opacity="0.35"/>
</svg>
