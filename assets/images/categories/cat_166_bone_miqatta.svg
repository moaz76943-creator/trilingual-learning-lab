<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="polishedIvory" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fffde7"/>
      <stop offset="80%" stop-color="#f5f5dc"/>
      <stop offset="100%" stop-color="#cfd8dc"/>
    </linearGradient>
  </defs>
  <!-- Long Polished Camel Bone / Walrus Ivory Tablet -->
  <rect x="30" y="70" width="140" height="60" rx="10" fill="url(#polishedIvory)" stroke="#8d6e63" stroke-width="2.5"/>
  <!-- Longitudinal Concave Groove (Resting Bed for the Reed Pen) -->
  <rect x="45" y="94" width="110" height="12" rx="4" fill="#d7ccc8" stroke="#a1887f" stroke-width="1.2"/>
  <ellipse cx="100" cy="100" rx="50" ry="3.5" fill="#efebe9"/>
  <!-- Transverse Micro-Cut Scar Line from Bevel Cuts -->
  <line x1="85" y1="80" x2="115" y2="120" stroke="#bf360c" stroke-width="1.5" stroke-dasharray="3,2"/>
  <!-- Decorative Floral Inlay Cartouche on Margin -->
  <circle cx="45" cy="82" r="3" fill="#ffd54f"/>
  <circle cx="155" cy="82" r="3" fill="#ffd54f"/>
  <circle cx="45" cy="118" r="3" fill="#ffd54f"/>
  <circle cx="155" cy="118" r="3" fill="#ffd54f"/>
</svg>
