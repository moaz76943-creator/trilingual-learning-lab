<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="marbleSlab" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f5f5f5"/>
      <stop offset="80%" stop-color="#e0e0e0"/>
      <stop offset="100%" stop-color="#cfd8dc"/>
    </linearGradient>
    <linearGradient id="brassGnomonGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b78103"/>
      <stop offset="50%" stop-color="#fbc02d"/>
      <stop offset="100%" stop-color="#fff59d"/>
    </linearGradient>
  </defs>
  <!-- Square Marble Base Plate with Chamfered Border -->
  <rect x="20" y="20" width="160" height="160" rx="6" fill="url(#marbleSlab)" stroke="#78909c" stroke-width="3"/>
  <!-- Marble Veining Details -->
  <path d="M 30,45 Q 60,65 75,110 T 110,165" fill="none" stroke="#b0bec5" stroke-width="1.2" opacity="0.6"/>
  <path d="M 140,25 Q 120,70 145,115 T 160,170" fill="none" stroke="#b0bec5" stroke-width="1" opacity="0.5"/>
  <!-- Radiating Hour Lines Engraved in Black Mastic -->
  <line x1="100" y1="140" x2="100" y2="35" stroke="#263238" stroke-width="2"/> <!-- Noon Line -->
  <line x1="100" y1="140" x2="40" y2="45" stroke="#37474f" stroke-width="1.5"/>
  <line x1="100" y1="140" x2="65" y2="38" stroke="#37474f" stroke-width="1.5"/>
  <line x1="100" y1="140" x2="135" y2="38" stroke="#37474f" stroke-width="1.5"/>
  <line x1="100" y1="140" x2="160" y2="45" stroke="#37474f" stroke-width="1.5"/>
  <line x1="100" y1="140" x2="30" y2="80" stroke="#37474f" stroke-width="1.2"/>
  <line x1="100" y1="140" x2="170" y2="80" stroke="#37474f" stroke-width="1.2"/>
  <!-- Solstice Hyperbolic Declination Curves -->
  <path d="M 35,65 Q 100,85 165,65" fill="none" stroke="#b71c1c" stroke-width="1.8"/> <!-- Summer Solstice Arc -->
  <path d="M 45,45 Q 100,55 155,45" fill="none" stroke="#0d47a1" stroke-width="1.5"/> <!-- Winter Solstice Arc -->
  <!-- Triangular Brass Gnomon (Stylus) Projected Upward -->
  <polygon points="98,140 102,140 100,75" fill="url(#brassGnomonGrad)" stroke="#4e342e" stroke-width="1.5"/>
  <circle cx="100" cy="140" r="4" fill="#ffd54f" stroke="#37474f" stroke-width="1"/>
  <!-- Shadow cast across the dial -->
  <polygon points="100,140 128,52 125,52" fill="#212121" fill-opacity="0.35"/>
</svg>
