<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="innerBrass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbc02d"/>
      <stop offset="50%" stop-color="#fff59d"/>
      <stop offset="100%" stop-color="#c49000"/>
    </linearGradient>
    <linearGradient id="outerSleeve" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#90a4ae" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#eceff1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#607d8b" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  <!-- Base Vessel Floor Section -->
  <rect x="20" y="160" width="160" height="20" fill="#455a64" stroke="#263238" stroke-width="2"/>
  <!-- Open Discharge Drain Hole through Floor -->
  <rect x="90" y="160" width="20" height="20" fill="#212121"/>
  <!-- Inner Standpipe Tube (Open at top and bottom) -->
  <rect x="92" y="60" width="16" height="100" fill="url(#innerBrass)" stroke="#3e2723" stroke-width="1.8"/>
  <!-- Outer Cap Sleeve (Closed at top, open at bottom slits) -->
  <rect x="80" y="45" width="40" height="105" rx="5" fill="url(#outerSleeve)" stroke="#263238" stroke-width="2"/>
  <!-- Inflow Arrow at bottom of sleeve -->
  <path d="M 72,152 L 82,152 M 128,152 L 118,152" stroke="#0288d1" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Cresting Siphon Curve at top -->
  <path d="M 87,55 Q 100,35 113,55" fill="none" stroke="#0288d1" stroke-width="3" stroke-linecap="round"/>
  <!-- Downward Flow Arrows inside inner pipe -->
  <line x1="100" y1="75" x2="100" y2="150" stroke="#0288d1" stroke-width="3" stroke-dasharray="5,3"/>
  <polygon points="100,155 96,145 104,145" fill="#0288d1"/>
</svg>
