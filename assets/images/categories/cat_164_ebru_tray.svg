<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="zincTray" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cfd8dc"/>
      <stop offset="50%" stop-color="#90a4ae"/>
      <stop offset="100%" stop-color="#546e7a"/>
    </linearGradient>
    <radialGradient id="sizeLiquid" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0f7fa"/>
      <stop offset="70%" stop-color="#b2ebf2"/>
      <stop offset="100%" stop-color="#80deea"/>
    </radialGradient>
  </defs>
  <!-- Rectangular Zinc / Copper Marbling Tray -->
  <rect x="20" y="25" width="160" height="150" rx="4" fill="url(#zincTray)" stroke="#37474f" stroke-width="3"/>
  <!-- Viscous Tragacanth Size Bath Surface -->
  <rect x="28" y="33" width="144" height="134" rx="2" fill="url(#sizeLiquid)"/>
  <!-- Concentric Swirling Pigment Drops on Water -->
  <circle cx="70" cy="75" r="28" fill="#1565c0" opacity="0.85"/>
  <circle cx="70" cy="75" r="18" fill="#fbc02d" opacity="0.9"/>
  <circle cx="70" cy="75" r="9" fill="#c62828"/>

  <circle cx="130" cy="115" r="32" fill="#2e7d32" opacity="0.85"/>
  <circle cx="130" cy="115" r="20" fill="#ad1457" opacity="0.9"/>
  <circle cx="130" cy="115" r="10" fill="#ffd54f"/>

  <!-- Combed Undulating Wave Contours -->
  <path d="M 30,50 Q 60,35 90,50 T 150,50" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
  <path d="M 30,100 Q 60,85 90,100 T 150,100" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
  <path d="M 30,145 Q 60,130 90,145 T 150,145" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
</svg>
