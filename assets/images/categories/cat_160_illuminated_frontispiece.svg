<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="parchmentGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffde7"/>
      <stop offset="100%" stop-color="#fff8e1"/>
    </linearGradient>
    <radialGradient id="frontispieceDome" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff9c4"/>
      <stop offset="50%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </radialGradient>
  </defs>
  <!-- Manuscript Folio Sheet -->
  <rect x="25" y="15" width="150" height="170" rx="4" fill="url(#parchmentGold)" stroke="#bcaaa4" stroke-width="2"/>
  <!-- Outer Ultramarine Blue Border Frame -->
  <rect x="35" y="25" width="130" height="150" rx="2" fill="none" stroke="#0d47a1" stroke-width="3"/>
  <rect x="39" y="29" width="122" height="142" rx="1" fill="none" stroke="#ffd54f" stroke-width="1.2"/>
  <!-- Upper Headpiece (Sar-Lowh) Arch Canopy -->
  <path d="M 45,85 L 45,40 C 45,40 100,28 100,28 C 100,28 155,40 155,40 L 155,85 Z" fill="url(#frontispieceDome)" stroke="#0d47a1" stroke-width="2"/>
  <!-- Fine Arabesque Lace within Headpiece -->
  <circle cx="100" cy="55" r="12" fill="#0d47a1" stroke="#ffd54f" stroke-width="1"/>
  <circle cx="100" cy="55" r="4" fill="#ffd54f"/>
  <text x="100" y="78" font-family="serif" font-size="10" font-weight="bold" fill="#0d47a1" text-anchor="middle">بِسْمِ اللَّهِ</text>
  <!-- Text Block Ruled Lines Below Headpiece -->
  <line x1="50" y1="105" x2="150" y2="105" stroke="#4e342e" stroke-width="1.8"/>
  <line x1="50" y1="125" x2="150" y2="125" stroke="#4e342e" stroke-width="1.8"/>
  <line x1="50" y1="145" x2="150" y2="145" stroke="#4e342e" stroke-width="1.8"/>
  <!-- Gold Verse Separator Rosettes on Margin -->
  <circle cx="163" cy="55" r="5" fill="#ffd54f" stroke="#0d47a1" stroke-width="1"/>
</svg>
