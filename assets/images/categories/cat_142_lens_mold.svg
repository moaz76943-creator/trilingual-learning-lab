<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bronzeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#aa7c11"/>
      <stop offset="100%" stop-color="#5c4308"/>
    </linearGradient>
    <radialGradient id="concaveShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3e2723" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#8d6e63" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Brass Lapidary Bowl Rim -->
  <circle cx="100" cy="100" r="70" fill="url(#bronzeGrad)" stroke="#3e2723" stroke-width="4"/>
  <!-- Spherical Depression Cavity -->
  <circle cx="100" cy="100" r="54" fill="#6d4c41"/>
  <circle cx="100" cy="100" r="54" fill="url(#concaveShadow)"/>
  <!-- Polishing Grooves Radial Indicators -->
  <circle cx="100" cy="100" r="38" fill="none" stroke="#ffecb3" stroke-width="1.5" stroke-dasharray="6,4"/>
  <circle cx="100" cy="100" r="22" fill="none" stroke="#ffecb3" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Lens Blank in Process -->
  <ellipse cx="100" cy="100" rx="16" ry="16" fill="#e0f7fa" fill-opacity="0.7" stroke="#00838f" stroke-width="2"/>
</svg>
