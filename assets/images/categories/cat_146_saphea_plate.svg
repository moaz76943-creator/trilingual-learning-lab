<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="sapheaBronze" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#fffde7"/>
      <stop offset="35%" stop-color="#ffd54f"/>
      <stop offset="75%" stop-color="#c49000"/>
      <stop offset="100%" stop-color="#4e342e"/>
    </radialGradient>
  </defs>
  <!-- Main Plate Rim -->
  <circle cx="100" cy="100" r="88" fill="url(#sapheaBronze)" stroke="#3e2723" stroke-width="4"/>
  <circle cx="100" cy="100" r="80" fill="#fff9c4"/>
  <!-- Universal Projection Dual Orthogonal Coordinate Net (Arcs from Equator & Solstices) -->
  <!-- Equatorial coordinate arcs -->
  <path d="M 20,100 A 80,80 0 0,1 180,100" fill="none" stroke="#6d4c41" stroke-width="2.5"/>
  <path d="M 24,80 A 80,80 0 0,1 176,80" fill="none" stroke="#8d6e63" stroke-width="1.2"/>
  <path d="M 36,60 A 80,80 0 0,1 164,60" fill="none" stroke="#8d6e63" stroke-width="1.2"/>
  <path d="M 54,40 A 80,80 0 0,1 146,40" fill="none" stroke="#8d6e63" stroke-width="1.2"/>
  <path d="M 24,120 A 80,80 0 0,0 176,120" fill="none" stroke="#8d6e63" stroke-width="1.2"/>
  <path d="M 36,140 A 80,80 0 0,0 164,140" fill="none" stroke="#8d6e63" stroke-width="1.2"/>
  <path d="M 54,160 A 80,80 0 0,0 146,160" fill="none" stroke="#8d6e63" stroke-width="1.2"/>
  <!-- Vertical Meridian Arcs -->
  <line x1="100" y1="20" x2="100" y2="180" stroke="#6d4c41" stroke-width="2.5"/>
  <path d="M 100,20 Q 75,100 100,180" fill="none" stroke="#8d6e63" stroke-width="1.2"/>
  <path d="M 100,20 Q 50,100 100,180" fill="none" stroke="#8d6e63" stroke-width="1.2"/>
  <path d="M 100,20 Q 125,100 100,180" fill="none" stroke="#8d6e63" stroke-width="1.2"/>
  <path d="M 100,20 Q 150,100 100,180" fill="none" stroke="#8d6e63" stroke-width="1.2"/>
  <!-- Central Pivot Grommet -->
  <circle cx="100" cy="100" r="6" fill="#bf360c" stroke="#3e2723" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="2" fill="#fffde7"/>
</svg>
