<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="leatherFlap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a1887f"/>
      <stop offset="50%" stop-color="#6d4c41"/>
      <stop offset="100%" stop-color="#3e2723"/>
    </linearGradient>
    <linearGradient id="valveSeat" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="50%" stop-color="#fff9c4"/>
      <stop offset="100%" stop-color="#b78103"/>
    </linearGradient>
  </defs>
  <!-- Cast Bronze Valve Seat Chamber Flange -->
  <rect x="25" y="130" width="150" height="25" rx="3" fill="url(#valveSeat)" stroke="#3e2723" stroke-width="2.5"/>
  <!-- Central Suction Port Hole in Seat -->
  <rect x="75" y="130" width="50" height="25" fill="#212121"/>
  <!-- Hinge Pin on Left -->
  <rect x="40" y="115" width="22" height="15" rx="2" fill="#5d4037" stroke="#271b16" stroke-width="1.5"/>
  <circle cx="51" cy="122" r="3.5" fill="#ffd54f"/>
  <!-- Flexible Weighted Leather Flapper (Open at 35° upward angle) -->
  <g transform="rotate(-35 51 122)">
    <rect x="51" y="116" width="90" height="12" rx="3" fill="url(#leatherFlap)" stroke="#271b16" stroke-width="2"/>
    <!-- Riveted Lead Backing Weight on Flap -->
    <rect x="80" y="110" width="45" height="6" rx="2" fill="#78909c" stroke="#263238" stroke-width="1"/>
    <circle cx="90" cy="122" r="2" fill="#ffd54f"/>
    <circle cx="115" cy="122" r="2" fill="#ffd54f"/>
  </g>
  <!-- Upward Inflowing Water Jet Stream -->
  <path d="M 85,170 Q 100,120 120,80" fill="none" stroke="#03a9f4" stroke-width="3" stroke-dasharray="4,3"/>
  <path d="M 100,170 Q 110,130 135,90" fill="none" stroke="#03a9f4" stroke-width="3" stroke-dasharray="4,3"/>
</svg>
