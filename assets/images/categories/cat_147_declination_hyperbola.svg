<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="skyArc" cx="50%" cy="80%" r="70%">
      <stop offset="0%" stop-color="#fffde7"/>
      <stop offset="50%" stop-color="#fff8e1"/>
      <stop offset="100%" stop-color="#ffe082"/>
    </radialGradient>
  </defs>
  <!-- Dial Surface Section -->
  <rect x="20" y="20" width="160" height="160" rx="4" fill="url(#skyArc)" stroke="#6d4c41" stroke-width="2.5"/>
  <!-- Equinoctial Straight Line (Zero Declination) -->
  <line x1="25" y1="85" x2="175" y2="85" stroke="#2e7d32" stroke-width="2"/>
  <text x="100" y="80" font-family="serif" font-size="10" font-weight="bold" fill="#2e7d32" text-anchor="middle">خَطُّ الاِعْتِدَالِ المَبْسُوطُ</text>
  <!-- Summer Solstice Hyperbola (Concave Downwards toward Gnomon) -->
  <path d="M 30,135 Q 100,105 170,135" fill="none" stroke="#d32f2f" stroke-width="2.5"/>
  <text x="100" y="145" font-family="serif" font-size="10" font-weight="bold" fill="#d32f2f" text-anchor="middle">قَوْسُ الاِنْقِلابِ الصَّيْفِيِّ</text>
  <!-- Winter Solstice Hyperbola (Far Reach) -->
  <path d="M 30,45 Q 100,60 170,45" fill="none" stroke="#1565c0" stroke-width="2.5"/>
  <text x="100" y="40" font-family="serif" font-size="10" font-weight="bold" fill="#1565c0" text-anchor="middle">قَوْسُ الاِنْقِلابِ الشَّتَوِيِّ</text>
  <!-- Central Meridian Axis -->
  <line x1="100" y1="25" x2="100" y2="175" stroke="#3e2723" stroke-width="1.5" stroke-dasharray="3,3"/>
</svg>
