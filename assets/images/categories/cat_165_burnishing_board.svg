<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="pearwoodPlank" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d7ccc8"/>
      <stop offset="40%" stop-color="#a1887f"/>
      <stop offset="80%" stop-color="#6d4c41"/>
      <stop offset="100%" stop-color="#4e342e"/>
    </linearGradient>
  </defs>
  <!-- Planed Hardwood Pearwood Burnishing Board (Isometric perspective) -->
  <polygon points="25,45 145,25 175,150 55,170" fill="url(#pearwoodPlank)" stroke="#271b16" stroke-width="2.5"/>
  <!-- Beveled Thickness Edge of Board -->
  <polygon points="55,170 175,150 175,160 55,180" fill="#3e2723" stroke="#271b16" stroke-width="1.5"/>
  <polygon points="25,45 55,170 55,180 25,55" fill="#5d4037" stroke="#271b16" stroke-width="1.5"/>
  <!-- Natural Wood Grain Flow Lines across Board -->
  <path d="M 40,65 Q 100,50 155,40" fill="none" stroke="#8d6e63" stroke-width="1.5" opacity="0.7"/>
  <path d="M 45,105 Q 110,85 165,75" fill="none" stroke="#8d6e63" stroke-width="1.5" opacity="0.7"/>
  <path d="M 50,140 Q 115,120 170,110" fill="none" stroke="#8d6e63" stroke-width="1.5" opacity="0.7"/>
  <!-- Paper Leaf Clamped Flat for Agate Burnishing -->
  <polygon points="45,65 130,50 150,135 65,150" fill="#ffffff" stroke="#bcaaa4" stroke-width="1.2" opacity="0.9"/>
</svg>
