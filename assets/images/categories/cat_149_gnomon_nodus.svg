<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="brassBeadGlow" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fff59d"/>
      <stop offset="70%" stop-color="#fbc02d"/>
      <stop offset="100%" stop-color="#827717"/>
    </radialGradient>
    <linearGradient id="horizontalGnomonBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#fff9c4"/>
      <stop offset="100%" stop-color="#b78103"/>
    </linearGradient>
  </defs>
  <!-- Background Optical Convergence Circles -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="#b0bec5" stroke-width="1.2" stroke-dasharray="4,4"/>
  <circle cx="100" cy="100" r="45" fill="none" stroke="#b0bec5" stroke-width="1.2" stroke-dasharray="4,4"/>
  <!-- Horizontal Gnomon Support Bracket -->
  <rect x="20" y="94" width="75" height="12" rx="3" fill="url(#horizontalGnomonBar)" stroke="#3e2723" stroke-width="2"/>
  <!-- Finely Turned Spherical Nodus Bead -->
  <circle cx="100" cy="100" r="16" fill="url(#brassBeadGlow)" stroke="#3e2723" stroke-width="2.5"/>
  <circle cx="95" cy="94" r="3.5" fill="#ffffff" opacity="0.8"/>
  <!-- Ray of Sunlight passing through Nodus creating pin-point shadow -->
  <line x1="60" y1="40" x2="140" y2="160" stroke="#f57f17" stroke-width="2" stroke-dasharray="5,3"/>
  <polygon points="140,160 132,152 144,150" fill="#f57f17"/>
</svg>
