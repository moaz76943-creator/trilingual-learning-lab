<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="ceramicGlazeBowl" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00695c"/>
      <stop offset="40%" stop-color="#26a69a"/>
      <stop offset="100%" stop-color="#004d40"/>
    </linearGradient>
    <radialGradient id="riceStarchJelly" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f5f5f5"/>
      <stop offset="100%" stop-color="#e0e0e0"/>
    </radialGradient>
  </defs>
  <!-- Persian Turquoise Glazed Ceramic Bowl Body -->
  <path d="M 35,75 C 35,145 165,145 165,75 Z" fill="url(#ceramicGlazeBowl)" stroke="#004d40" stroke-width="2.5"/>
  <ellipse cx="100" cy="75" rx="65" ry="18" fill="#004d40"/>
  <!-- Viscous Starch and Clarified Egg-White Sizing Jelly -->
  <ellipse cx="100" cy="78" rx="55" ry="14" fill="url(#riceStarchJelly)" stroke="#80cbc4" stroke-width="1.5"/>
  <ellipse cx="94" cy="74" rx="20" ry="5" fill="#ffffff" opacity="0.8"/>
  <!-- Dipped Silk Sizing Sponge / Cloth Pad -->
  <rect x="75" y="45" width="50" height="25" rx="8" fill="#fff9c4" stroke="#fbc02d" stroke-width="1.5"/>
  <!-- Alum Crystal Lumps beside Bowl -->
  <polygon points="160,150 175,140 185,155 170,165" fill="#e0f7fa" stroke="#80deea" stroke-width="1.2"/>
  <polygon points="145,158 155,150 162,162 150,168" fill="#e0f7fa" stroke="#80deea" stroke-width="1.2"/>
</svg>
