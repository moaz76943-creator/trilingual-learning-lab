<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fff8e1"/>
      <stop offset="100%" stop-color="#ffecb3"/>
    </radialGradient>
  </defs>
  <!-- Background Metallic Plate Segment -->
  <rect x="25" y="25" width="150" height="150" rx="6" fill="url(#ringGlow)" stroke="#b78103" stroke-width="3"/>
  <!-- Classical Kufic Engraved Band -->
  <rect x="35" y="80" width="130" height="40" rx="3" fill="#3e2723" stroke="#ffd54f" stroke-width="1.5"/>
  <text x="100" y="105" font-family="serif" font-size="14" font-weight="bold" fill="#ffd54f" text-anchor="middle">حَدُّ الاِعْتِدَالِ</text>
  <!-- Calibrated Metric Ticks above and below line -->
  <line x1="40" y1="70" x2="160" y2="70" stroke="#c62828" stroke-width="2.5"/>
  <circle cx="100" cy="70" r="4" fill="#c62828"/>
  <text x="100" y="60" font-family="serif" font-size="10" font-weight="bold" fill="#c62828" text-anchor="middle">مَنْ طَمِعَ خَسِرَ</text>
  <!-- Safety Equilibrium Marks below -->
  <line x1="50" y1="135" x2="150" y2="135" stroke="#2e7d32" stroke-width="2"/>
  <text x="100" y="150" font-family="serif" font-size="10" font-weight="bold" fill="#2e7d32" text-anchor="middle">مَقَامُ القَنَاعَةِ</text>
</svg>
