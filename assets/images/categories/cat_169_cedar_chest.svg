<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="cedarGrainChest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bcaaa4"/>
      <stop offset="40%" stop-color="#8d6e63"/>
      <stop offset="80%" stop-color="#5d4037"/>
      <stop offset="100%" stop-color="#3e2723"/>
    </linearGradient>
    <linearGradient id="brassLock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff59d"/>
      <stop offset="50%" stop-color="#fbc02d"/>
      <stop offset="100%" stop-color="#b78103"/>
    </linearGradient>
  </defs>
  <!-- Floor Shadow -->
  <ellipse cx="100" cy="175" rx="80" ry="12" fill="#212121" opacity="0.35"/>
  <!-- Sturdy Carved Cedar Chest Body -->
  <rect x="25" y="80" width="150" height="85" rx="6" fill="url(#cedarGrainChest)" stroke="#271b16" stroke-width="2.5"/>
  <!-- Heavy Domed / Gabled Chest Lid -->
  <path d="M 20,80 L 35,45 L 165,45 L 180,80 Z" fill="url(#cedarGrainChest)" stroke="#271b16" stroke-width="2.5"/>
  <ellipse cx="100" cy="45" rx="65" ry="10" fill="#5d4037"/>
  <!-- Heavy Ornamental Wrought-Brass Corner Hasps and Strap Hinges -->
  <rect x="35" y="45" width="8" height="120" fill="url(#brassLock)" stroke="#3e2723" stroke-width="1.2"/>
  <circle cx="39" cy="65" r="2.5" fill="#212121"/>
  <circle cx="39" cy="120" r="2.5" fill="#212121"/>
  <rect x="157" y="45" width="8" height="120" fill="url(#brassLock)" stroke="#3e2723" stroke-width="1.2"/>
  <circle cx="161" cy="65" r="2.5" fill="#212121"/>
  <circle cx="161" cy="120" r="2.5" fill="#212121"/>
  <!-- Central Chased Brass Lockplate and Padlock Hasp -->
  <rect x="88" y="70" width="24" height="35" rx="3" fill="url(#brassLock)" stroke="#3e2723" stroke-width="1.5"/>
  <circle cx="100" cy="80" r="3" fill="#212121"/>
  <path d="M 100,83 L 100,92" stroke="#212121" stroke-width="1.5"/>
  <!-- Four Short Turned Bracket Feet -->
  <rect x="32" y="165" width="16" height="10" rx="2" fill="#3e2723"/>
  <rect x="152" y="165" width="16" height="10" rx="2" fill="#3e2723"/>
</svg>
