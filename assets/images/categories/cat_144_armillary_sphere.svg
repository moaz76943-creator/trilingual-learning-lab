<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="brassSphereGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff59d"/>
      <stop offset="30%" stop-color="#fbc02d"/>
      <stop offset="70%" stop-color="#b78103"/>
      <stop offset="100%" stop-color="#4e342e"/>
    </radialGradient>
    <linearGradient id="standBronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8d6e63"/>
      <stop offset="100%" stop-color="#3e2723"/>
    </linearGradient>
  </defs>
  <!-- Classical Heavy Stand Base -->
  <path d="M 60,185 L 140,185 L 125,165 L 75,165 Z" fill="url(#standBronze)" stroke="#271b16" stroke-width="2"/>
  <rect x="92" y="145" width="16" height="20" fill="url(#standBronze)" stroke="#271b16" stroke-width="1.5"/>
  <circle cx="100" cy="145" r="8" fill="#d4af37"/>
  <!-- Outer Meridian Fixed Ring -->
  <circle cx="100" cy="85" r="62" fill="none" stroke="url(#brassSphereGrad)" stroke-width="5"/>
  <!-- Equatorial Horizontal Ring -->
  <ellipse cx="100" cy="85" rx="60" ry="20" fill="none" stroke="url(#brassSphereGrad)" stroke-width="3.5"/>
  <!-- Inclined Ecliptic Zodiac Band -->
  <g transform="rotate(-23.5 100 85)">
    <ellipse cx="100" cy="85" rx="58" ry="18" fill="none" stroke="#ffd54f" stroke-width="4.5"/>
    <ellipse cx="100" cy="85" rx="58" ry="18" fill="none" stroke="#d84315" stroke-width="1.5" stroke-dasharray="3,3"/>
  </g>
  <!-- Solstitial Colure Ring -->
  <ellipse cx="100" cy="85" rx="24" ry="60" fill="none" stroke="url(#brassSphereGrad)" stroke-width="2.5"/>
  <!-- Central Earth Sphere Model -->
  <circle cx="100" cy="85" r="10" fill="#29b6f6" stroke="#01579b" stroke-width="1.5"/>
  <!-- Celestial Polar Axis Pin -->
  <line x1="60" y1="20" x2="140" y2="150" stroke="#ffd54f" stroke-width="3" stroke-linecap="round"/>
</svg>
