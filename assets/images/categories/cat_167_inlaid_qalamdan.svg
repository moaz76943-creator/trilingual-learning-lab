<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="qalamdanBrass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff59d"/>
      <stop offset="40%" stop-color="#fbc02d"/>
      <stop offset="80%" stop-color="#c49000"/>
      <stop offset="100%" stop-color="#4e342e"/>
    </linearGradient>
    <linearGradient id="silverInlay" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#eceff1"/>
      <stop offset="100%" stop-color="#cfd8dc"/>
    </linearGradient>
  </defs>
  <!-- Long Tubular Cylindrical Pen-Case Body -->
  <rect x="20" y="85" width="125" height="30" rx="6" fill="url(#qalamdanBrass)" stroke="#271b16" stroke-width="2.5"/>
  <!-- Integrated Square Inkwell Cast Seamlessly on Right End -->
  <rect x="145" y="70" width="35" height="60" rx="4" fill="url(#qalamdanBrass)" stroke="#271b16" stroke-width="2.5"/>
  <ellipse cx="162" cy="70" rx="14" ry="7" fill="#ffd54f" stroke="#3e2723" stroke-width="1.5"/>
  <circle cx="162" cy="65" r="4" fill="#3e2723"/> <!-- Lid Finial -->
  <!-- Silver-Inlaid Interlace Arabesques along Pen-Case Tube -->
  <g fill="none" stroke="url(#silverInlay)" stroke-width="1.8">
    <path d="M 30,100 Q 45,90 60,100 T 90,100 T 120,100 T 140,100"/>
    <path d="M 30,100 Q 45,110 60,100 T 90,100 T 120,100 T 140,100"/>
  </g>
  <!-- Inlaid Silver Cartouche Rosettes -->
  <circle cx="60" cy="100" r="4" fill="#ffffff" stroke="#c49000" stroke-width="1"/>
  <circle cx="90" cy="100" r="4" fill="#ffffff" stroke="#c49000" stroke-width="1"/>
  <circle cx="120" cy="100" r="4" fill="#ffffff" stroke="#c49000" stroke-width="1"/>
  <!-- Side Lugs for Scribe's Belt Cord Suspension -->
  <rect x="25" y="79" width="6" height="6" fill="#3e2723"/>
  <rect x="135" y="79" width="6" height="6" fill="#3e2723"/>
  <!-- Braided Cord loop -->
  <path d="M 28,79 Q 80,50 138,79" fill="none" stroke="#d32f2f" stroke-width="2" stroke-dasharray="3,2"/>
</svg>
