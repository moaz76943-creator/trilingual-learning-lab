<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="camWood" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#d7ccc8"/>
      <stop offset="60%" stop-color="#8d6e63"/>
      <stop offset="100%" stop-color="#4e342e"/>
    </radialGradient>
  </defs>
  <!-- Central Driven Axle Shaft -->
  <line x1="30" y1="100" x2="170" y2="100" stroke="#3e2723" stroke-width="14" stroke-linecap="round"/>
  <circle cx="100" cy="100" r="18" fill="#5d4037" stroke="#271b16" stroke-width="2"/>
  <!-- Eccentric Egg-Shaped Cam Lobe (Left Phase) -->
  <path d="M 60,100 C 60,65 80,45 80,100 C 80,130 60,130 60,100 Z" fill="url(#camWood)" stroke="#271b16" stroke-width="2.5" transform="rotate(-30 70 100)"/>
  <!-- Opposing Eccentric Cam Lobe (Right Phase 180° Offset) -->
  <path d="M 120,100 C 120,65 140,45 140,100 C 140,130 120,130 120,100 Z" fill="url(#camWood)" stroke="#271b16" stroke-width="2.5" transform="rotate(150 130 100)"/>
  <!-- Roller Follower Contact Wheels -->
  <circle cx="75" cy="50" r="9" fill="#ffd54f" stroke="#3e2723" stroke-width="2"/>
  <line x1="75" y1="50" x2="75" y2="20" stroke="#37474f" stroke-width="4" stroke-linecap="round"/>
  <circle cx="125" cy="150" r="9" fill="#ffd54f" stroke="#3e2723" stroke-width="2"/>
  <line x1="125" y1="150" x2="125" y2="180" stroke="#37474f" stroke-width="4" stroke-linecap="round"/>
</svg>
