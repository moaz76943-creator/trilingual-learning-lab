<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="ironShaft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#424242"/>
      <stop offset="50%" stop-color="#757575"/>
      <stop offset="100%" stop-color="#212121"/>
    </linearGradient>
    <linearGradient id="brassHead" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff59d"/>
      <stop offset="50%" stop-color="#fbc02d"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
  </defs>
  <!-- Wooden Turned Handle (Angled from top left) -->
  <path d="M 30,20 L 70,45 L 60,60 L 20,35 Z" fill="#6d4c41" stroke="#3e2723" stroke-width="2"/>
  <circle cx="25" cy="27" r="8" fill="#4e342e"/>
  <!-- Forged Iron Long Shank Stem -->
  <line x1="65" y1="52" x2="135" y2="122" stroke="url(#ironShaft)" stroke-width="8" stroke-linecap="round"/>
  <!-- Brass Mounting Collar -->
  <rect x="125" y="115" width="18" height="18" rx="2" fill="#ffd54f" stroke="#3e2723" stroke-width="1.5" transform="rotate(45 134 124)"/>
  <!-- Heavy Brass Palmette / Rosette Finishing Stamp Head -->
  <g transform="translate(145, 135)">
    <!-- Intaglio Engraved Palmette Motif on Stamping Face -->
    <path d="M 0,0 C -15,15 -10,35 15,35 C 40,35 45,15 30,0 Z" fill="url(#brassHead)" stroke="#bf360c" stroke-width="2"/>
    <circle cx="15" cy="18" r="6" fill="#bf360c"/>
    <line x1="15" y1="0" x2="15" y2="30" stroke="#bf360c" stroke-width="2"/>
    <path d="M 5,10 Q 15,20 25,10" fill="none" stroke="#bf360c" stroke-width="1.8"/>
  </g>
  <!-- Heat Ember Shimmer Waves -->
  <path d="M 165,125 Q 175,120 180,130" fill="none" stroke="#ff5722" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M 175,140 Q 185,135 190,145" fill="none" stroke="#ff5722" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
</svg>
