<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="knuckleGrain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bcaaa4"/>
      <stop offset="50%" stop-color="#8d6e63"/>
      <stop offset="100%" stop-color="#4e342e"/>
    </linearGradient>
  </defs>
  <!-- Left Side Plank Knuckle Fingers -->
  <rect x="35" y="30" width="60" height="25" rx="4" fill="url(#knuckleGrain)" stroke="#271b16" stroke-width="2"/>
  <rect x="35" y="85" width="60" height="25" rx="4" fill="url(#knuckleGrain)" stroke="#271b16" stroke-width="2"/>
  <rect x="35" y="140" width="60" height="25" rx="4" fill="url(#knuckleGrain)" stroke="#271b16" stroke-width="2"/>
  <!-- Right Side Intermeshing Knuckle Fingers -->
  <rect x="105" y="57" width="60" height="25" rx="4" fill="url(#knuckleGrain)" stroke="#271b16" stroke-width="2"/>
  <rect x="105" y="112" width="60" height="25" rx="4" fill="url(#knuckleGrain)" stroke="#271b16" stroke-width="2"/>
  <!-- Central Hollow Axial Cylinder Channel Where They Interlock -->
  <rect x="88" y="25" width="24" height="150" rx="6" fill="#3e2723" stroke="#ffd54f" stroke-width="1.5" stroke-dasharray="4,2"/>
  <circle cx="100" cy="42" r="4" fill="#ffd54f"/>
  <circle cx="100" cy="70" r="4" fill="#ffd54f"/>
  <circle cx="100" cy="97" r="4" fill="#ffd54f"/>
  <circle cx="100" cy="125" r="4" fill="#ffd54f"/>
  <circle cx="100" cy="152" r="4" fill="#ffd54f"/>
</svg>
