<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="pasteboardBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#efebe9"/>
      <stop offset="50%" stop-color="#d7ccc8"/>
      <stop offset="100%" stop-color="#bcaaa4"/>
    </linearGradient>
    <linearGradient id="silkCord" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#80deea"/>
      <stop offset="100%" stop-color="#00838f"/>
    </linearGradient>
  </defs>
  <!-- Rigid Rectangular Pasteboard Tablet -->
  <rect x="25" y="15" width="150" height="170" rx="4" fill="url(#pasteboardBack)" stroke="#5d4037" stroke-width="2.5"/>
  <!-- Top and Bottom Reinforced Starch Edge Strips -->
  <rect x="25" y="15" width="150" height="15" fill="#8d6e63"/>
  <rect x="25" y="170" width="150" height="15" fill="#8d6e63"/>
  <!-- Left and Right Needle-Pierced Punctures (Perforations) -->
  <g fill="#271b16">
    <circle cx="35" cy="40" r="2"/>
    <circle cx="35" cy="55" r="2"/>
    <circle cx="35" cy="70" r="2"/>
    <circle cx="35" cy="85" r="2"/>
    <circle cx="35" cy="100" r="2"/>
    <circle cx="35" cy="115" r="2"/>
    <circle cx="35" cy="130" r="2"/>
    <circle cx="35" cy="145" r="2"/>
    <circle cx="35" cy="160" r="2"/>

    <circle cx="165" cy="40" r="2"/>
    <circle cx="165" cy="55" r="2"/>
    <circle cx="165" cy="70" r="2"/>
    <circle cx="165" cy="85" r="2"/>
    <circle cx="165" cy="100" r="2"/>
    <circle cx="165" cy="115" r="2"/>
    <circle cx="165" cy="130" r="2"/>
    <circle cx="165" cy="145" r="2"/>
    <circle cx="165" cy="160" r="2"/>
  </g>
  <!-- Horizontal Taut Silk Ruling Cords -->
  <g stroke="url(#silkCord)" stroke-width="1.8">
    <line x1="35" y1="40" x2="165" y2="40"/>
    <line x1="35" y1="55" x2="165" y2="55"/>
    <line x1="35" y1="70" x2="165" y2="70"/>
    <line x1="35" y1="85" x2="165" y2="85"/>
    <line x1="35" y1="100" x2="165" y2="100"/>
    <line x1="35" y1="115" x2="165" y2="115"/>
    <line x1="35" y1="130" x2="165" y2="130"/>
    <line x1="35" y1="145" x2="165" y2="145"/>
    <line x1="35" y1="160" x2="165" y2="160"/>
  </g>
  <!-- Vertical Margin Boundary Cords in Crimson -->
  <line x1="48" y1="30" x2="48" y2="170" stroke="#c62828" stroke-width="1.8" stroke-dasharray="4,2"/>
  <line x1="152" y1="30" x2="152" y2="170" stroke="#c62828" stroke-width="1.8" stroke-dasharray="4,2"/>
</svg>
