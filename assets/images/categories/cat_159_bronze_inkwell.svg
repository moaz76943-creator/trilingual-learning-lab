<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bronzeInkwell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="50%" stop-color="#fbc02d"/>
      <stop offset="100%" stop-color="#b78103"/>
    </linearGradient>
  </defs>
  <!-- Octagonal Faceted Bronze Inkwell Body -->
  <rect x="45" y="85" width="110" height="80" rx="6" fill="url(#bronzeInkwell)" stroke="#3e2723" stroke-width="3"/>
  <ellipse cx="100" cy="85" rx="55" ry="16" fill="#fbc02d" stroke="#3e2723" stroke-width="2"/>
  <!-- Circular Inkwell Aperture (Neck) -->
  <ellipse cx="100" cy="85" rx="32" ry="10" fill="#212121" stroke="#3e2723" stroke-width="2"/>
  <!-- Raw Silk Wad (Liqah) saturated with lustrous black ink -->
  <ellipse cx="100" cy="85" rx="26" ry="8" fill="#111111"/>
  <path d="M 85,83 Q 100,78 115,83" fill="none" stroke="#424242" stroke-width="1.5"/>
  <!-- Engraved Kufic Arabesque Cartouche on Front Panel -->
  <rect x="58" y="112" width="84" height="35" rx="4" fill="#3e2723" stroke="#ffd54f" stroke-width="1.5"/>
  <text x="100" y="134" font-family="serif" font-size="12" font-weight="bold" fill="#ffd54f" text-anchor="middle">ن وَالقَلَمِ</text>
  <!-- Hinged Dome Lid leaning behind -->
  <path d="M 75,70 Q 100,45 125,70 Z" fill="url(#bronzeInkwell)" stroke="#3e2723" stroke-width="2"/>
  <circle cx="100" cy="45" r="4" fill="#ffd54f"/>
</svg>
