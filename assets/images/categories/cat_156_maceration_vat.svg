<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="limestoneVat" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#efebe9"/>
      <stop offset="50%" stop-color="#d7ccc8"/>
      <stop offset="100%" stop-color="#bcaaa4"/>
    </linearGradient>
    <linearGradient id="limeWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f5f5" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e0e0e0" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <!-- Stone Vat Basin Container (Perspective Trapezoid) -->
  <path d="M 25,65 L 175,65 L 155,175 L 45,175 Z" fill="url(#limestoneVat)" stroke="#5d4037" stroke-width="3"/>
  <ellipse cx="100" cy="65" rx="75" ry="20" fill="#bcaaa4" stroke="#5d4037" stroke-width="2"/>
  <!-- Lime Water Surface -->
  <ellipse cx="100" cy="72" rx="68" ry="16" fill="url(#limeWater)"/>
  <!-- Bundles of Soaking Flax and Mulberry Fibers -->
  <path d="M 60,74 Q 85,95 110,75" fill="none" stroke="#8d6e63" stroke-width="4" stroke-linecap="round"/>
  <path d="M 85,76 Q 110,95 140,74" fill="none" stroke="#6d4c41" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Wooden Stirring Paddle Leaning in Vat -->
  <line x1="120" y1="30" x2="80" y2="140" stroke="#ffd54f" stroke-width="6" stroke-linecap="round"/>
  <rect x="70" y="115" width="22" height="35" rx="3" fill="#ffb300" stroke="#5d4037" stroke-width="1.5" transform="rotate(18 81 132)"/>
  <!-- Drain Spigot Valve at Bottom -->
  <rect x="92" y="175" width="16" height="12" fill="#3e2723"/>
</svg>
