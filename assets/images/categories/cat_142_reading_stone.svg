<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="crystalGlow" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#e0f7fa" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#80deea" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00838f" stop-opacity="0.85"/>
    </radialGradient>
    <linearGradient id="parchmentBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e6cb"/>
      <stop offset="100%" stop-color="#d7ba89"/>
    </linearGradient>
  </defs>
  <!-- Background Manuscript Page -->
  <rect x="20" y="30" width="160" height="140" rx="6" fill="url(#parchmentBase)" stroke="#8d6e63" stroke-width="2"/>
  <line x1="35" y1="55" x2="165" y2="55" stroke="#a1887f" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="35" y1="75" x2="165" y2="75" stroke="#a1887f" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="35" y1="95" x2="165" y2="95" stroke="#a1887f" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="35" y1="115" x2="165" y2="115" stroke="#a1887f" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="35" y1="135" x2="165" y2="135" stroke="#a1887f" stroke-width="2" stroke-dasharray="4,3"/>
  <!-- Planoconvex Reading Stone Dome -->
  <path d="M 50,130 C 50,65 150,65 150,130 Z" fill="url(#crystalGlow)" stroke="#006064" stroke-width="3"/>
  <!-- Reflected Light Arc -->
  <path d="M 65,115 C 65,80 120,75 140,95" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <!-- Magnified Arabic Calligraphy Fragment underneath lens -->
  <text x="100" y="118" font-family="serif" font-size="22" font-weight="bold" fill="#004d40" text-anchor="middle">نُورٌ</text>
</svg>
