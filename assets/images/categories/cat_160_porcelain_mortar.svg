<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="whitePorcelain" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eceff1"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cfd8dc"/>
    </linearGradient>
    <radialGradient id="lapisDust" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#448aff"/>
      <stop offset="60%" stop-color="#1565c0"/>
      <stop offset="100%" stop-color="#0d47a1"/>
    </radialGradient>
  </defs>
  <!-- Heavy Porcelain Mortar Bowl -->
  <path d="M 40,75 L 45,145 C 45,175 155,175 155,145 L 160,75 Z" fill="url(#whitePorcelain)" stroke="#90a4ae" stroke-width="2.5"/>
  <ellipse cx="100" cy="75" rx="60" ry="18" fill="#ffffff" stroke="#90a4ae" stroke-width="2"/>
  <!-- Mortar Cavity with Ground Ultramarine Lapis Lazuli Dust -->
  <ellipse cx="100" cy="80" rx="48" ry="12" fill="#cfd8dc"/>
  <ellipse cx="100" cy="82" rx="36" ry="8" fill="url(#lapisDust)"/>
  <!-- Polished Agate Pestle Pestle Leaning Inside -->
  <g transform="rotate(30 110 90)">
    <rect x="100" y="25" width="20" height="95" rx="8" fill="#d7ccc8" stroke="#5d4037" stroke-width="2"/>
    <ellipse cx="110" cy="115" rx="14" ry="10" fill="#a1887f" stroke="#5d4037" stroke-width="1.8"/>
  </g>
  <!-- Fine Lapis Particles Spattering -->
  <circle cx="70" cy="72" r="1.5" fill="#1565c0"/>
  <circle cx="135" cy="76" r="1.5" fill="#1565c0"/>
</svg>
