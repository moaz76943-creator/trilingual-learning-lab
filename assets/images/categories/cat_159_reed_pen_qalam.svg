<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="reedShaft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff8e1"/>
      <stop offset="40%" stop-color="#ffe082"/>
      <stop offset="80%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#8d6e63"/>
    </linearGradient>
  </defs>
  <!-- Main Reed Cane Stem (Diagonal 45 degrees) -->
  <line x1="25" y1="25" x2="145" y2="145" stroke="url(#reedShaft)" stroke-width="14" stroke-linecap="round"/>
  <!-- Reed Growth Nodes Rings -->
  <line x1="55" y1="65" x2="65" y2="55" stroke="#6d4c41" stroke-width="3"/>
  <line x1="95" y1="105" x2="105" y2="95" stroke="#6d4c41" stroke-width="3"/>
  <!-- Carefully Beveled Writing Nib (Pared on Nib Cutting Bone) -->
  <polygon points="140,140 175,175 168,179 135,147" fill="#fff9c4" stroke="#4e342e" stroke-width="1.5"/>
  <!-- Inked Nib Tip with Slit -->
  <polygon points="165,165 178,178 171,182 160,170" fill="#000000"/>
  <line x1="162" y1="164" x2="175" y2="180" stroke="#ffffff" stroke-width="0.8"/>
  <!-- Fresh Drop of Rich Black Ink -->
  <circle cx="180" cy="184" r="3.5" fill="#000000"/>
  <!-- Bone Pen-Cutting Block (Miqattah) in Background -->
  <rect x="120" y="160" width="60" height="15" rx="3" fill="#efebe9" stroke="#bcaaa4" stroke-width="1.5" transform="rotate(-20 150 167)"/>
</svg>
