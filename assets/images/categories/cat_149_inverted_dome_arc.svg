<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="domeSky" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0d47a1"/>
      <stop offset="50%" stop-color="#1976d2"/>
      <stop offset="100%" stop-color="#bbdefb"/>
    </linearGradient>
  </defs>
  <!-- Hemispherical Cross-Section Bowl Profile -->
  <path d="M 25,60 C 25,160 175,160 175,60 Z" fill="url(#domeSky)" stroke="#0d47a1" stroke-width="3"/>
  <!-- Rim Horizontal Line -->
  <line x1="20" y1="60" x2="180" y2="60" stroke="#3e2723" stroke-width="3"/>
  <!-- Inverted Concentric Declination Levels -->
  <path d="M 38,80 C 45,135 155,135 162,80" fill="none" stroke="#ffeb3b" stroke-width="1.8"/>
  <path d="M 52,100 C 65,140 135,140 148,100" fill="none" stroke="#ffeb3b" stroke-width="1.8"/>
  <path d="M 72,120 C 85,142 115,142 128,120" fill="none" stroke="#ffeb3b" stroke-width="1.8"/>
  <!-- Constellation Star Inscriptions -->
  <circle cx="100" cy="135" r="2.5" fill="#ffffff"/>
  <circle cx="85" cy="115" r="2" fill="#ffffff"/>
  <circle cx="115" cy="115" r="2" fill="#ffffff"/>
  <circle cx="70" cy="92" r="2" fill="#ffffff"/>
  <circle cx="130" cy="92" r="2" fill="#ffffff"/>
  <!-- Inscription -->
  <text x="100" y="45" font-family="serif" font-size="11" font-weight="bold" fill="#0d47a1" text-anchor="middle">مُحَاكَاةُ الفَلَكِ المَعْكُوسِ</text>
</svg>
