<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="vesselChamber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#455a64"/>
      <stop offset="50%" stop-color="#90a4ae"/>
      <stop offset="100%" stop-color="#37474f"/>
    </linearGradient>
    <linearGradient id="inflowingWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4fc3f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0277bd" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <!-- Sealed Pressure Tank Body -->
  <rect x="45" y="45" width="110" height="120" rx="10" fill="url(#vesselChamber)" stroke="#263238" stroke-width="3"/>
  <!-- Cutaway Interior Showing Rising Water Level Displacing Air -->
  <rect x="55" y="55" width="90" height="100" rx="6" fill="#eceff1" stroke="#37474f" stroke-width="1.5"/>
  <rect x="55" y="95" width="90" height="60" fill="url(#inflowingWater)"/>
  <!-- Inflow Funnel at Top Left -->
  <polygon points="65,20 85,20 80,45 70,45" fill="#ffd54f" stroke="#3e2723" stroke-width="1.5"/>
  <line x1="75" y1="45" x2="75" y2="95" stroke="#0288d1" stroke-width="3" stroke-dasharray="3,3"/>
  <!-- Siphon Drain Pipe at Bottom Left -->
  <path d="M 62,145 Q 45,145 45,120 Q 45,95 35,95 L 35,175" fill="none" stroke="#37474f" stroke-width="4"/>
  <!-- Top Right Air Exit Nozzle to Flute -->
  <rect x="120" y="25" width="16" height="20" rx="2" fill="#d4af37" stroke="#3e2723" stroke-width="1.5"/>
  <!-- Pressurized Air Jet Rising -->
  <line x1="128" y1="45" x2="128" y2="15" stroke="#00b0ff" stroke-width="3.5" stroke-linecap="round"/>
  <polygon points="128,10 124,18 132,18" fill="#00b0ff"/>
</svg>
