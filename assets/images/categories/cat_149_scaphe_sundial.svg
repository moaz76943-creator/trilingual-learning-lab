<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="concaveBowlShade" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#37474f"/>
      <stop offset="60%" stop-color="#78909c"/>
      <stop offset="90%" stop-color="#b0bec5"/>
      <stop offset="100%" stop-color="#eceff1"/>
    </radialGradient>
    <linearGradient id="marbleBlock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="100%" stop-color="#cfd8dc"/>
    </linearGradient>
  </defs>
  <!-- Square Stone Pedestal Block -->
  <rect x="20" y="20" width="160" height="160" rx="8" fill="url(#marbleBlock)" stroke="#546e7a" stroke-width="3"/>
  <!-- Hemispherical Bowl Cavity (Top View Circular Aperture) -->
  <circle cx="100" cy="100" r="68" fill="url(#concaveBowlShade)" stroke="#263238" stroke-width="3"/>
  <!-- Inscribed Declination Hyperbolas & Hour Arcs inside the Hollow -->
  <path d="M 45,75 Q 100,105 155,75" fill="none" stroke="#ffe082" stroke-width="1.8"/> <!-- Winter Solstice Arc -->
  <path d="M 40,100 Q 100,118 160,100" fill="none" stroke="#81c784" stroke-width="1.8"/> <!-- Equinox Arc -->
  <path d="M 45,125 Q 100,135 155,125" fill="none" stroke="#ff8a80" stroke-width="1.8"/> <!-- Summer Solstice Arc -->
  <!-- Cross Hour Radial Curves -->
  <path d="M 100,32 L 100,168" fill="none" stroke="#eceff1" stroke-width="1.5" stroke-dasharray="3,3"/>
  <path d="M 60,42 Q 85,100 60,158" fill="none" stroke="#cfd8dc" stroke-width="1.2"/>
  <path d="M 140,42 Q 115,100 140,158" fill="none" stroke="#cfd8dc" stroke-width="1.2"/>
  <!-- Horizontal Brass Pointer Rod across rim -->
  <line x1="32" y1="100" x2="100" y2="100" stroke="#fbc02d" stroke-width="3" stroke-linecap="round"/>
  <!-- Central Gnomon Nodus Bead at Exact Sphere Center -->
  <circle cx="100" cy="100" r="5" fill="#ffd54f" stroke="#3e2723" stroke-width="1.5"/>
  <!-- Focal Point Shadow Cast into Lower Cavity -->
  <circle cx="100" cy="120" r="4" fill="#1a237e" opacity="0.8"/>
</svg>
