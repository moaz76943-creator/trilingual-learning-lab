<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="ivoryFolio" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fffde7"/>
      <stop offset="80%" stop-color="#fff9c4"/>
      <stop offset="100%" stop-color="#fff59d"/>
    </linearGradient>
  </defs>
  <!-- Burnished Ivory Sized Paper Folio (Perspective Rectangle) -->
  <rect x="30" y="20" width="140" height="160" rx="4" fill="url(#ivoryFolio)" stroke="#bcaaa4" stroke-width="2"/>
  <!-- High Mirror-Sheen Reflection Arc Across the Page -->
  <path d="M 30,70 Q 100,20 170,80 L 170,120 Q 100,60 30,110 Z" fill="#ffffff" opacity="0.6"/>
  <!-- Crisp Razor-Sharp Calligraphy Strokes (Zero Bleed / Zero Feathering) -->
  <g fill="#111111" stroke="#000000" stroke-width="0.8">
    <path d="M 55,65 Q 90,60 120,65 L 120,70 Q 85,67 55,70 Z"/>
    <path d="M 130,55 L 135,55 L 135,90 L 130,90 Z"/>
    <path d="M 55,100 Q 95,95 145,100 L 145,105 Q 95,102 55,105 Z"/>
    <circle cx="95" cy="52" r="3"/>
  </g>
  <!-- Calligrapher's Scalpel Erasing a Spot Cleanly Without Tearing -->
  <line x1="140" y1="125" x2="175" y2="155" stroke="#78909c" stroke-width="4" stroke-linecap="round"/>
  <polygon points="135,120 145,123 140,132" fill="#cfd8dc" stroke="#455a64" stroke-width="1"/>
</svg>
