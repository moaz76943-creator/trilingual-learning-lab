<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="feltTexture" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eceff1"/>
      <stop offset="50%" stop-color="#cfd8dc"/>
      <stop offset="100%" stop-color="#b0bec5"/>
    </linearGradient>
    <linearGradient id="wetPaperSheet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>
  </defs>
  <!-- Lower Couching Wool Felt Layer -->
  <rect x="25" y="45" width="150" height="120" rx="6" fill="url(#feltTexture)" stroke="#546e7a" stroke-width="2.5"/>
  <!-- Felt Weft Soft Texture Stipples -->
  <line x1="35" y1="65" x2="165" y2="65" stroke="#90a4ae" stroke-width="1.5" stroke-dasharray="4,6"/>
  <line x1="35" y1="95" x2="165" y2="95" stroke="#90a4ae" stroke-width="1.5" stroke-dasharray="4,6"/>
  <line x1="35" y1="125" x2="165" y2="125" stroke="#90a4ae" stroke-width="1.5" stroke-dasharray="4,6"/>
  <!-- Freshly Couched Wet Sheet of Linen Paper Being Transferred -->
  <g transform="translate(15, -15)">
    <path d="M 35,65 L 145,65 L 135,155 L 25,155 Z" fill="url(#wetPaperSheet)" stroke="#78909c" stroke-width="1.8"/>
    <!-- Slight Ripple of Fresh Pulp -->
    <path d="M 45,85 Q 85,95 125,85" fill="none" stroke="#e0e0e0" stroke-width="2"/>
    <path d="M 45,115 Q 85,125 125,115" fill="none" stroke="#e0e0e0" stroke-width="2"/>
  </g>
  <!-- Wooden Press Post Corner Guide -->
  <rect x="15" y="35" width="8" height="140" fill="#4e342e"/>
  <rect x="177" y="35" width="8" height="140" fill="#4e342e"/>
</svg>
