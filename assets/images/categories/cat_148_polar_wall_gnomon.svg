<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bronzeRod" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff59d"/>
      <stop offset="40%" stop-color="#fbc02d"/>
      <stop offset="80%" stop-color="#c49000"/>
      <stop offset="100%" stop-color="#4e342e"/>
    </linearGradient>
  </defs>
  <!-- Vertical Wall Surface in Cross-Section (Left Side) -->
  <rect x="20" y="20" width="30" height="160" fill="#cfd8dc" stroke="#546e7a" stroke-width="2"/>
  <line x1="20" y1="60" x2="50" y2="60" stroke="#90a4ae" stroke-width="1"/>
  <line x1="20" y1="100" x2="50" y2="100" stroke="#90a4ae" stroke-width="1"/>
  <line x1="20" y1="140" x2="50" y2="140" stroke="#90a4ae" stroke-width="1"/>
  <!-- Wall Anchor Bracket (Cast Bronze) -->
  <rect x="45" y="45" width="20" height="30" rx="3" fill="#5d4037" stroke="#271b16" stroke-width="1.5"/>
  <circle cx="55" cy="60" r="3" fill="#ffd54f"/>
  <!-- Angled Polar Rod projecting into space -->
  <polygon points="55,55 160,135 155,142 50,62" fill="url(#bronzeRod)" stroke="#3e2723" stroke-width="2"/>
  <!-- Strut Support Arm from lower anchor -->
  <rect x="45" y="115" width="16" height="24" rx="2" fill="#5d4037" stroke="#271b16" stroke-width="1.5"/>
  <line x1="55" y1="125" x2="120" y2="107" stroke="#d4af37" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Decorative Sharp Finial at the Pointer Tip -->
  <polygon points="160,135 175,145 155,142" fill="#ffeb3b" stroke="#3e2723" stroke-width="1.5"/>
</svg>
