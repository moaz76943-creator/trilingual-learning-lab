<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="walnutWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8d6e63"/>
      <stop offset="50%" stop-color="#5d4037"/>
      <stop offset="100%" stop-color="#3e2723"/>
    </linearGradient>
  </defs>
  <!-- Floor Shadow -->
  <ellipse cx="100" cy="180" rx="75" ry="10" fill="#212121" opacity="0.3"/>
  <!-- Crossed Folding Rahl Planks (X-Shape in Perspective) -->
  <!-- Left-to-Right Slanted Wing -->
  <path d="M 35,45 L 70,45 L 165,165 L 130,165 Z" fill="url(#walnutWood)" stroke="#271b16" stroke-width="2"/>
  <!-- Right-to-Left Slanted Wing Crossing It -->
  <path d="M 165,45 L 130,45 L 35,165 L 70,165 Z" fill="url(#walnutWood)" stroke="#271b16" stroke-width="2"/>
  <!-- Central Interlocking Wooden Hinge Pivot Line -->
  <ellipse cx="100" cy="105" rx="14" ry="14" fill="#3e2723" stroke="#ffd54f" stroke-width="1.5"/>
  <circle cx="100" cy="105" r="4" fill="#ffd54f"/>
  <!-- Pierced Arabesque Openwork on Lower Feet -->
  <circle cx="65" cy="145" r="8" fill="#212121"/>
  <circle cx="135" cy="145" r="8" fill="#212121"/>
  <!-- Upper Book Cradle V-Shaped Rest Support -->
  <path d="M 52,45 L 100,80 L 148,45" fill="none" stroke="#ffd54f" stroke-width="2"/>
  <!-- Bound Codex Folios Resting in V-Cradle -->
  <polygon points="50,40 100,75 150,40 145,35 100,70 55,35" fill="#fffde7" stroke="#bcaaa4" stroke-width="1.2"/>
</svg>
