<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="circleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e1f5fe"/>
      <stop offset="100%" stop-color="#b3e5fc"/>
    </radialGradient>
  </defs>
  <!-- Background Sheet -->
  <rect x="20" y="20" width="160" height="160" rx="4" fill="#fafafa" stroke="#cfd8dc" stroke-width="2"/>
  <!-- Primary Circumscribed Circle (Diameter = Alif Height) -->
  <circle cx="100" cy="100" r="65" fill="url(#circleGlow)" stroke="#0288d1" stroke-width="2"/>
  <!-- Horizontal and Vertical Diameter Lines -->
  <line x1="35" y1="100" x2="165" y2="100" stroke="#0288d1" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="100" y1="35" x2="100" y2="165" stroke="#0288d1" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- Stately Upright Proportioned Alif (Seven Rhombic Dots High) -->
  <path d="M 97,35 C 97,35 103,35 103,37 L 103,162 C 103,164 97,165 96,165 C 95,165 97,150 97,35 Z" fill="#212121" stroke="#000000" stroke-width="1.5"/>
  <!-- Slight Elegant Crown Head (Tarwis) at the Top Left -->
  <polygon points="97,35 90,42 97,44" fill="#212121"/>
  <!-- Semicircular Sub-Arc for Nun and Lam Bowls -->
  <path d="M 35,100 A 65,65 0 0,0 165,100" fill="none" stroke="#d81b60" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="100" y="125" font-family="serif" font-size="10" font-weight="bold" fill="#d81b60" text-anchor="middle">قَوْسُ النُّونِ</text>
</svg>
