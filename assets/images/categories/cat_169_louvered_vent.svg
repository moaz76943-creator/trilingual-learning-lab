<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="louverFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6d4c41"/>
      <stop offset="50%" stop-color="#4e342e"/>
      <stop offset="100%" stop-color="#271b16"/>
    </linearGradient>
  </defs>
  <!-- Cedar Wall Panel Section -->
  <rect x="25" y="25" width="150" height="150" rx="6" fill="#8d6e63" stroke="#271b16" stroke-width="2.5"/>
  <!-- Recessed Louver Window Casement Frame -->
  <rect x="45" y="40" width="110" height="120" rx="4" fill="url(#louverFrame)" stroke="#ffd54f" stroke-width="2"/>
  <!-- Fine Woven Brass Mesh Backing (Diamond Grid Behind Slats) -->
  <g stroke="#fbc02d" stroke-width="0.8" opacity="0.5">
    <line x1="50" y1="50" x2="150" y2="150"/>
    <line x1="50" y1="80" x2="150" y2="180"/>
    <line x1="50" y1="150" x2="150" y2="50"/>
    <line x1="50" y1="120" x2="150" y2="20"/>
  </g>
  <!-- Angled Cedar Louver Slats (Shading rain and pests, circulating breeze) -->
  <polygon points="50,55 150,55 145,68 55,68" fill="#a1887f" stroke="#271b16" stroke-width="1.2"/>
  <polygon points="50,75 150,75 145,88 55,88" fill="#a1887f" stroke="#271b16" stroke-width="1.2"/>
  <polygon points="50,95 150,95 145,108 55,108" fill="#a1887f" stroke="#271b16" stroke-width="1.2"/>
  <polygon points="50,115 150,115 145,128 55,128" fill="#a1887f" stroke="#271b16" stroke-width="1.2"/>
  <polygon points="50,135 150,135 145,148 55,148" fill="#a1887f" stroke="#271b16" stroke-width="1.2"/>
  <!-- Fresh Circulating Air Streamlines Flowing Through -->
  <path d="M 30,90 Q 60,80 80,95" fill="none" stroke="#e0f7fa" stroke-width="2" stroke-linecap="round"/>
  <path d="M 120,110 Q 140,95 170,110" fill="none" stroke="#e0f7fa" stroke-width="2" stroke-linecap="round"/>
</svg>
