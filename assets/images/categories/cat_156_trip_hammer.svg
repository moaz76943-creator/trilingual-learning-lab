<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="oakBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8d6e63"/>
      <stop offset="50%" stop-color="#5d4037"/>
      <stop offset="100%" stop-color="#3e2723"/>
    </linearGradient>
    <linearGradient id="ironShoeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78909c"/>
      <stop offset="50%" stop-color="#37474f"/>
      <stop offset="100%" stop-color="#212121"/>
    </linearGradient>
  </defs>
  <!-- Stone Mortar Basin at Bottom Right -->
  <rect x="110" y="145" width="75" height="40" rx="4" fill="#90a4ae" stroke="#37474f" stroke-width="2.5"/>
  <rect x="120" y="145" width="55" height="20" fill="#cfd8dc"/>
  <!-- Macerating Pulp inside Mortar Basin -->
  <ellipse cx="147" cy="155" rx="22" ry="7" fill="#ffffff" stroke="#b0bec5" stroke-width="1"/>
  <!-- Pivot Fulcrum Stand at Left -->
  <polygon points="35,185 25,110 50,110" fill="#4e342e" stroke="#271b16" stroke-width="2"/>
  <circle cx="37" cy="110" r="5" fill="#ffd54f" stroke="#271b16" stroke-width="1.5"/>
  <!-- Long Oak Trip-Hammer Lever Arm (Elevated at 20° angle) -->
  <g transform="rotate(-15 37 110)">
    <rect x="10" y="104" width="145" height="14" rx="2" fill="url(#oakBeam)" stroke="#271b16" stroke-width="2"/>
    <!-- Iron Drop-Hammer Head & Shoe -->
    <rect x="135" y="110" width="22" height="40" rx="3" fill="url(#ironShoeGrad)" stroke="#212121" stroke-width="1.8"/>
  </g>
  <!-- Rotating Camshaft Lobe Actuator at Tail -->
  <circle cx="15" cy="130" r="16" fill="#8d6e63" stroke="#271b16" stroke-width="2"/>
  <path d="M 15,130 Q 30,120 28,140 Z" fill="#ffd54f" stroke="#3e2723" stroke-width="1.5"/>
  <!-- Splashing Macerated Fiber Droplets -->
  <circle cx="135" cy="138" r="2" fill="#ffffff"/>
  <circle cx="160" cy="135" r="2.5" fill="#ffffff"/>
</svg>
