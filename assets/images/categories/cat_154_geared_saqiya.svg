<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="gearWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bcaaa4"/>
      <stop offset="50%" stop-color="#8d6e63"/>
      <stop offset="100%" stop-color="#4e342e"/>
    </linearGradient>
  </defs>
  <!-- Stone Well Curb Wall -->
  <rect x="25" y="150" width="150" height="35" rx="3" fill="#90a4ae" stroke="#37474f" stroke-width="2"/>
  <!-- Horizontal Crown Gear Wheel (Top View Ellipse in Perspective) -->
  <ellipse cx="100" cy="70" rx="65" ry="22" fill="url(#gearWood)" stroke="#271b16" stroke-width="2.5"/>
  <ellipse cx="100" cy="70" rx="35" ry="12" fill="#5d4037"/>
  <!-- Vertical Oak Teeth on Crown Wheel Rim -->
  <rect x="45" y="55" width="6" height="15" fill="#ffd54f" stroke="#3e2723" stroke-width="1"/>
  <rect x="70" y="60" width="6" height="15" fill="#ffd54f" stroke="#3e2723" stroke-width="1"/>
  <rect x="100" y="62" width="6" height="15" fill="#ffd54f" stroke="#3e2723" stroke-width="1"/>
  <rect x="130" y="60" width="6" height="15" fill="#ffd54f" stroke="#3e2723" stroke-width="1"/>
  <rect x="155" y="55" width="6" height="15" fill="#ffd54f" stroke="#3e2723" stroke-width="1"/>
  <!-- Central Vertical Wooden Drive Spindle Shaft -->
  <line x1="100" y1="20" x2="100" y2="70" stroke="#3e2723" stroke-width="10" stroke-linecap="round"/>
  <!-- Horizontal Whim Beam for Draft Animal -->
  <line x1="40" y1="30" x2="160" y2="30" stroke="#5d4037" stroke-width="6" stroke-linecap="round"/>
  <!-- Vertical Lantern Pinion Meshing at Right (90° Offset) -->
  <g transform="translate(150, 60)">
    <circle cx="15" cy="40" r="22" fill="url(#gearWood)" stroke="#271b16" stroke-width="2"/>
    <circle cx="15" cy="40" r="6" fill="#3e2723"/>
    <!-- Lantern Pegs -->
    <circle cx="6" cy="30" r="3" fill="#ffd54f"/>
    <circle cx="24" cy="30" r="3" fill="#ffd54f"/>
    <circle cx="28" cy="48" r="3" fill="#ffd54f"/>
    <circle cx="10" cy="52" r="3" fill="#ffd54f"/>
  </g>
</svg>
